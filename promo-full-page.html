<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beauty Renovation Full Page Promo</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 18% 8%, rgba(218, 184, 122, 0.26), transparent 24rem),
          linear-gradient(180deg, #ffffff 0%, #f4f1ea 48%, #ece6dc 100%);
        font-family: Arial, sans-serif;
      }

      .poster {
        width: 900px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 70px 0 96px;
        display: flex;
        justify-content: center;
        position: relative;
      }

      .page {
        width: 520px;
        display: block;
        border-radius: 10px;
        box-shadow:
          0 40px 90px rgba(67, 48, 29, 0.24),
          0 12px 28px rgba(67, 48, 29, 0.18);
      }

      .controls {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        width: 520px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
      }

      .arrow,
      .dots {
        background: rgba(98, 98, 98, 0.58);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.14);
        backdrop-filter: blur(6px);
      }

      .arrow {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        position: relative;
      }

      .arrow::before {
        content: "";
        position: absolute;
        inset: 21px 24px;
        border-top: 5px solid #fff;
        border-left: 5px solid #fff;
      }

      .arrow.left::before {
        transform: rotate(-45deg);
      }

      .arrow.right::before {
        transform: rotate(135deg);
      }

      .dots {
        height: 58px;
        min-width: 220px;
        padding: 0 36px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }

      .dots span {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.62);
      }

      .dots span:first-child {
        background: #fff;
        width: 14px;
        height: 14px;
      }
    </style>
  </head>
  <body>
    <main class="poster">
      <img class="page" src="full-page-raw.png" alt="Beauty Renovation full landing page preview" />
      <div class="controls" aria-hidden="true">
        <div class="arrow left"></div>
        <div class="dots">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="arrow right"></div>
      </div>
    </main>
  </body>
</html>
