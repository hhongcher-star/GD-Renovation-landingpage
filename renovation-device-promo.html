<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beauty Interiors Pro Renovation - Device Mockup</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1600px; height: 900px; margin: 0; overflow: hidden; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #f7f2e8;
      background:
        radial-gradient(circle at 72% 24%, rgba(214, 165, 78, .13), transparent 27%),
        linear-gradient(rgba(196, 149, 73, .05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(196, 149, 73, .05) 1px, transparent 1px),
        #101112;
      background-size: auto, 44px 44px, 44px 44px, auto;
    }
    .poster { position: relative; width: 100%; height: 100%; isolation: isolate; }
    .poster::before,
    .poster::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .34;
      background:
        linear-gradient(28deg, transparent 47%, rgba(216, 170, 88, .24) 48%, transparent 49%) 80px 80px / 330px 230px,
        linear-gradient(-32deg, transparent 47%, rgba(216, 170, 88, .18) 48%, transparent 49%) 10px 130px / 390px 260px;
    }
    .poster::after { transform: scaleX(-1); opacity: .16; }
    .gold-floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 90px;
      background: #c99a4a;
      clip-path: polygon(0 42%, 42% 10%, 100% 55%, 100% 100%, 0 100%);
      z-index: 0;
    }
    .brand {
      position: absolute;
      left: 84px;
      top: 60px;
      width: 490px;
      z-index: 5;
    }
    .brand-logo { width: 188px; height: 66px; object-fit: contain; object-position: left center; }
    .eyebrow {
      margin: 28px 0 16px;
      color: #d9ae63;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2.4px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: 64px;
      line-height: .92;
      letter-spacing: 0;
      text-transform: uppercase;
      max-width: 470px;
    }
    h1 span { color: #d7a651; }
    .lead {
      width: 380px;
      margin: 25px 0 0;
      color: #c8c5be;
      font-size: 17px;
      line-height: 1.6;
    }
    .services {
      display: flex;
      gap: 10px;
      margin-top: 26px;
      flex-wrap: wrap;
      width: 400px;
    }
    .service {
      padding: 9px 12px;
      border: 1px solid rgba(215, 166, 81, .5);
      color: #eee8dc;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .device-stage {
      position: absolute;
      left: 492px;
      right: 40px;
      top: 54px;
      bottom: 42px;
      z-index: 2;
    }
    .laptop {
      position: absolute;
      left: 20px;
      top: 0;
      width: 900px;
      height: 650px;
      filter: drop-shadow(0 34px 34px rgba(0,0,0,.62));
    }
    .lid {
      position: absolute;
      inset: 0 0 42px;
      padding: 17px 17px 25px;
      border: 3px solid #5d5d5d;
      border-radius: 25px 25px 10px 10px;
      background: #050505;
      box-shadow: inset 0 0 0 2px #1e1e1e;
    }
    .camera { position: absolute; top: 7px; left: 50%; width: 5px; height: 5px; border-radius: 50%; background: #323232; }
    .screen {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 10px 10px 2px 2px;
      background: #ede8df;
    }
    .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
    .base {
      position: absolute;
      left: -28px;
      right: -28px;
      bottom: 14px;
      height: 38px;
      background: linear-gradient(#bcbcbc, #666 53%, #272727 55%, #090909);
      clip-path: polygon(2% 0, 98% 0, 100% 74%, 96% 100%, 4% 100%, 0 74%);
      border-radius: 2px 2px 16px 16px;
    }
    .notch { position: absolute; top: 0; left: 44%; width: 12%; height: 7px; border-radius: 0 0 8px 8px; background: #797979; }
    .phone {
      position: absolute;
      right: 2px;
      top: 192px;
      width: 260px;
      height: 540px;
      padding: 11px;
      border: 4px solid #555;
      border-radius: 42px;
      background: #080808;
      box-shadow: 0 28px 38px rgba(0,0,0,.7), inset 0 0 0 2px #202020;
    }
    .phone::before {
      content: "";
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 8px;
      width: 82px;
      height: 22px;
      transform: translateX(-50%);
      border-radius: 14px;
      background: #050505;
    }
    .phone-screen { width: 100%; height: 100%; overflow: hidden; border-radius: 28px; background: #eee; }
    .phone-screen img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
    .badge {
      position: absolute;
      left: -44px;
      bottom: 80px;
      width: 128px;
      height: 128px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 2px solid #d6a653;
      color: #d6a653;
      background: #111;
      font-size: 16px;
      font-weight: 900;
      text-align: center;
      line-height: 1.05;
      transform: rotate(-9deg);
      box-shadow: 0 10px 24px rgba(0,0,0,.4);
    }
    .badge::before { content: ""; position: absolute; inset: 8px; border: 1px dashed #d6a653; border-radius: 50%; }
    .badge span { position: relative; }
    .caption {
      position: absolute;
      left: 532px;
      bottom: 38px;
      z-index: 5;
      width: 660px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 13px 20px;
      color: #171717;
      background: #d3a24e;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      box-shadow: 0 10px 25px rgba(0,0,0,.3);
    }
    .caption strong { font-size: 20px; }
    .caption i { width: 1px; height: 34px; background: rgba(0,0,0,.35); }
  </style>
</head>
<body>
  <main class="poster">
    <div class="gold-floor"></div>

    <section class="brand">
      <img class="brand-logo" src="assets/images/beauty-decor-full-logo.png" alt="Beauty Interiors Pro Renovation">
      <p class="eyebrow">Interior Design &amp; Renovation</p>
      <h1>Transform<br>Your <span>Space.</span></h1>
      <p class="lead">Thoughtful interiors, dependable workmanship and complete renovation solutions for homes and businesses.</p>
      <div class="services">
        <span class="service">Residential</span>
        <span class="service">Commercial</span>
        <span class="service">Design &amp; Build</span>
      </div>
    </section>

    <section class="device-stage" aria-label="Responsive website presentation">
      <div class="laptop">
        <div class="lid">
          <span class="camera"></span>
          <div class="screen"><img src="full-page-raw.png" alt="Website shown on laptop"></div>
        </div>
        <div class="base"><span class="notch"></span></div>
      </div>
      <div class="phone">
        <div class="phone-screen"><img src="beauty-renovation-full-page-promo.png" alt="Website shown on phone"></div>
      </div>
      <div class="badge"><span>DESIGN<br>BUILD<br>RENOVATE</span></div>
    </section>

    <div class="caption"><strong>Beauty Interiors</strong><i></i><span>Professional renovation solutions across Kuala Lumpur</span></div>
  </main>
</body>
</html>
